<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#efece7}#c{display:block}</style>
<canvas id="c" width="380" height="460"></canvas>
<script src="/live2d/live2dcubismcore.min.js"></script>
<script src="/live2d/live2d.min.js"></script>
<script type="module">
  /**
   * 压力测试：每 500ms 用优先级 3 强行打断当前动作，观察是否出现部件错位
   * （Hiyori 的动作同时驱动 ParamArmLA/LB 与 PartArmA/B，属于易错结构）。
   * 结果挂在 window.__frames，由 Playwright 取走做像素分析。
   */
  const p = new URLSearchParams(location.search);
  const id = p.get('m') ?? 'hiyori';
  const file = p.get('f') ?? 'Hiyori.model3.json';
  const canvas = document.getElementById('c');
  window.__frames = [];
  window.__log = [];

  try {
    const { init } = await import('/_l2d/index.js');
    const l2d = init(canvas);
    await l2d.load({ path: `/live2d/${id}/${file}`, scale: 1.0, position: [0, 0], logLevel: 'error' });
    l2d.resize();

    const groups = Object.keys(l2d.getMotions());
    window.__log.push('groups=' + groups.join(','));

    let i = 0;
    setInterval(() => {
      const g = groups[i % groups.length];
      l2d.playMotion(g, undefined, 3);
      window.__log.push('play ' + g);
      requestAnimationFrame(() => {
        window.__frames.push(canvas.toDataURL('image/png'));
      });
      i += 1;
    }, 500);

    document.title = 'ready';
  } catch (e) {
    document.title = 'err:' + e.message;
  }
</script>
